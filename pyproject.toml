# =================================================================
# 构建系统 (Build System)
# =================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =================================================================
# 项目核心元数据 (PEP 621)
# =================================================================
[project]
name = "PoleSudBot"
version = "0.2.4"
description = "基于 Nonebot2 和 go-cqhttp 开发，以 postgresql 作为数据库，非常可爱的绪山真寻bot"
requires-python = ">=3.10, <4.0"
license = { text = "AGPL" }
authors = [
    { name = "PoleSudBot" },
    { name = "HibiKier", email = "775757368@qq.com" },
]


dependencies = [
    "playwright>=1.41.1,<2.0.0",
    "nonebot-adapter-onebot>=2.3.1,<3.0.0",
    "nonebot-plugin-apscheduler>=0.5,<0.6",
    "tortoise-orm>=0.21.0",
    "cattrs>=23.2.3,<24.0.0",
    "ruamel-yaml>=0.18.5,<0.19.0",
    "strenum>=0.4.15,<0.5.0",
    "nonebot-plugin-session>=0.2.3,<0.4.0",
    "ujson>=5.9.0,<6.0.0",
    "nb-cli>=1.3.0,<2.0.0",
    "nonebot2[fastapi]>=2.3.3,<3.0.0",
    "pillow>=11.0.0",
    "retrying>=1.3.4,<2.0.0",
    "aiofiles>=24.1.0",
    "nonebot-plugin-htmlrender==0.7.0a3",
    "pypinyin>=0.55.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "lxml>=5.1.0,<6.0.0",
    "psutil>=5.9.8,<6.0.0",
    "feedparser>=6.0.11,<7.0.0",
    "imagehash>=4.3.1,<5.0.0",
    "cn2an>=0.5.22,<0.6.0",
    "dateparser>=1.2.0,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "python-multipart>=0.0.9,<0.1.0",
    "aiocache[redis]>=0.12.3,<0.13.0",
    "py-cpuinfo>=9.0.0,<10.0.0",
    "nonebot-plugin-alconna>=0.59.0",
    "nonebot-plugin-genshinuid",
    "tenacity>=9.0.0,<10.0.0",
    "nonebot-plugin-uninfo>0.4.1",
    "nonebot-plugin-waiter>=0.8.1,<0.9.0",
    "multidict>=6.0.0,!=6.3.2",
    "json_repair>=0.54.0,<0.60.0",
    "alibabacloud-devops20210625>=5.0.2,<6.0.0",
    "nonebot-plugin-datastore",
    "httpx>=0.20,<1.0",
    "pyyaml>=6,<7",
    "nonebot-plugin-memes",
    "nonebot-plugin-heweather",
    "nonebot-plugin-paper",
    "nonebot-plugin-fortune",
    "nonebot-plugin-today-waifu",
    "nonebot-plugin-multincm",
    "nonebot-plugin-ottohzys",
    "nonebot-plugin-sticker-saver",
    "nonebot-plugin-githubcard",
    "nonebot-plugin-tarot",
    "nonebot-plugin-whateat-pic",
    "nonebot-plugin-tsugu-bangdream-bot",
    "nonebot-plugin-wordcloud",
    "nonebot-plugin-manosaba-memes",
    "playwright-stealth>=2.0.1",
    "tomli-w>=1.2.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.3",
    "bilibili-api-python>=17.4.1",
    "spacy-pkuseg>=1.0.1",
    "zhdate>=0.1",
    "chinesecalendar>=1.11.0",
    "openai>=2.24.0",
    "lunardate>=0.2.2",
    "mcp>=1.8.0",
    "aiodocker>=0.24.0",
    "mcstatus>=13.1.0,<14.0.0",
    "mctools>=1.4.1,<2.0.0",
]
# --- 修改部分结束 ---

# 可选依赖 (Optional Dependencies)
# 保持不变
[project.optional-dependencies]
redis = ["redis>=5"]
postgresql = ["asyncpg>=0.20.0"]
dev = [
    "nonebug>=0.4,<0.5",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.6.1,<4.0.0",
    "pytest-asyncio>=0.25,<0.26",
    "pytest-xdist>=3.3.1,<4.0.0",
    "respx>=0.21.1,<0.22.0",
    "ruff>=0.8.0,<0.9.0",
    "pre-commit>=4.0.0,<5.0.0",
]

[tool.hatch.build]
packages = ["zhenxun"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
nonebot-plugin-memes = {path = "plugins/nonebot-plugin-memes", editable = true}
nonebot-plugin-heweather = {path = "plugins/nonebot-plugin-heweather", editable = true}
nonebot-plugin-paper = {path = "plugins/nonebot-plugin-paper", editable = true}
nonebot-plugin-fortune = {path = "plugins/nonebot_plugin_fortune", editable = true}
nonebot-plugin-today-waifu = {path = "plugins/nonebot-plugin-today-waifu", editable = true}
nonebot-plugin-multincm = {path = "plugins/nonebot-plugin-multincm", editable = true}
nonebot-plugin-ottohzys = {path = "plugins/nonebot-plugin-ottohzys", editable = true}
nonebot-plugin-sticker-saver = {path = "plugins/nonebot-plugin-sticker-saver", editable = true}
nonebot-plugin-githubcard = {path = "plugins/nonebot_plugin_githubcard", editable = true}
nonebot-plugin-tarot = {path = "plugins/nonebot_plugin_tarot", editable = true}
nonebot-plugin-whateat-pic = {path = "plugins/nonebot-plugin-whateat-pic", editable = true}
nonebot-plugin-tsugu-bangdream-bot = {path = "plugins/nonebot-plugin-tsugu-bangdream-bot", editable = true}
nonebot-plugin-wordcloud = {path = "plugins/nonebot-plugin-wordcloud", editable = true}
nonebot-plugin-manosaba-memes = {path = "plugins/nonebot-plugin-manosaba-memes", editable = true}
nonebot-plugin-genshinuid = {path = "sidecar/.runtime/vendors/nonebot-plugin-genshinuid", editable = true}







[tool.uv.pip]

index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.nonebot]
plugins = [
    "nonebot_plugin_apscheduler",
    "nonebot_plugin_session",
    "nonebot_plugin_htmlrender",
    "nonebot_plugin_alconna",
]
plugin_dirs = ["zhenxun/services", "zhenxun/builtin_plugins", "zhenxun/plugins"]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "F", "W", "E", "I", "UP", "ASYNC", "C4", "T10",
    "T20", "PYI", "PT", "Q", "TID", "RUF",
]
ignore = [
    "E402", "UP037", "RUF001", "RUF002", "RUF003", "TID252",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["zhenxun"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
defineConstant = { PYDANTIC_V2 = true }
executionEnvironments = [
    { root = "./" },
]
typeCheckingMode = "standard"
reportShadowedImports = false
disableBytesTypePromotions = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
